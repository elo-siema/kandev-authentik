name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # go.mod resolves the Kandev SDK from a sibling checkout.
      - name: Fetch Kandev SDK
        run: git clone --depth 1 --branch v0.94.0 https://github.com/kdlbs/kandev ../kandev
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Tidy and format
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
      - name: Vet, test, package
        run: |
          make vet
          make test
          make package
